name: Import Lucheya photo assets
on:
  push:
    paths:
      - .github/workflows/import-photos.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import-photos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Download studio images and rewrite references
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from urllib.request import Request, urlopen
          from urllib.error import URLError, HTTPError
          import time
          
          sources = {
              "https://korolive.ru/upload/medialibrary/f54/v2age3atfm5yoeu7crwi82tef9n3mhzh.jpg": "assets/lucheya-logo.jpg",
              "https://korolive.ru/upload/iblock/d41/6bd5o1t143gwoc9p28ttlnf4w1dt7ceu.jpg": "assets/studio-main.jpg",
              "https://korolive.ru/upload/iblock/f10/h726f7rpi6xyo9j43bo2bhemjpb81xtj.jpg": "assets/studio-lesson.jpg",
              "https://korolive.ru/upload/iblock/744/6evcgfeow0ex64fpvgw7adbj6qggx562.jpg": "assets/studio-still-life.jpg",
              "https://korolive.ru/upload/iblock/823/yjg19ka1djze3x8ezm7iyxyhvzoe0vqc.jpg": "assets/studio-entrance.jpg",
          }
          failed = {}
          for url, local in sources.items():
              print("Importing", local, flush=True)
              error = None
              for attempt in range(3):
                  try:
                      req = Request(url, headers={
                          "User-Agent": "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/125.0 Safari/537.36",
                          "Accept": "image/avif,image/webp,image/apng,image/*,*/*;q=0.8",
                          "Referer": "https://korolive.ru/",
                      })
                      with urlopen(req, timeout=25) as response:
                          data = response.read(12 * 1024 * 1024 + 1)
                          content_type = response.headers.get("Content-Type", "")
                      if len(data) > 12 * 1024 * 1024 or len(data) < 100:
                          raise ValueError("Invalid image size")
                      if not (data.startswith(b"\xff\xd8\xff") or data.startswith(b"\x89PNG") or data.startswith(b"RIFF") or data.startswith(b"GIF8")):
                          raise ValueError("Unexpected data (not image), content-type " + content_type)
                      Path(local).parent.mkdir(parents=True,exist_ok=True)
                      Path(local).write_bytes(data)
                      print(f"Imported {local}: {len(data)} bytes", flush=True)
                      error = None
                      break
                  except Exception as exc:
                      error = str(exc)
                      print(f"Attempt {attempt+1} failed: {exc}", flush=True)
                      time.sleep(2)
              if error:
                  failed[url] = error
          
          if failed:
              print("Failed files:", failed, flush=True)
              raise SystemExit("Cannot replace remote images because some originals were not downloaded")
          
          index = Path("index.html")
          html = index.read_text(encoding="utf-8")
          for old, new in sources.items():
              if old not in html:
                  raise SystemExit("Expected image reference missing: " + old)
              html = html.replace(old, new)
          # Local icon and OG image are now included via the same replacement.
          index.write_text(html, encoding="utf-8")
          assert "korolive.ru/upload/" not in html
          print("Rewrote all studio image references to local assets",flush=True)
          PY
      - name: Commit imported assets
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets/
          git diff --cached --quiet && exit 0
          git commit -m "Host original Lucheya photos in repository"
          git push origin HEAD:main
